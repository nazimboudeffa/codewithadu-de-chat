<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG Chat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f0f0f;
    color: #e0e0e0;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: #1a1a2e;
    padding: 16px 24px;
    border-bottom: 1px solid #2a2a3e;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  header .logo {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, #6c5ce7, #a29bfe);
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 16px; color: #fff;
  }

  header h1 {
    font-size: 18px; font-weight: 600; color: #f0f0f0;
  }

  header span {
    font-size: 12px; color: #888; margin-left: auto;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
    animation: fadeIn 0.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.user {
    align-self: flex-end;
  }

  .msg .bubble {
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.55;
    font-size: 14px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg.user .bubble {
    background: #6c5ce7;
    color: #fff;
    border-bottom-right-radius: 4px;
  }

  .msg.bot .bubble {
    background: #1e1e30;
    color: #d0d0d0;
    border-bottom-left-radius: 4px;
    border: 1px solid #2a2a3e;
  }

  .msg .label {
    font-size: 11px;
    color: #666;
    margin-bottom: 4px;
    padding: 0 4px;
  }

  .msg.bot .sources {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .msg.bot .source-card {
    background: #16162a;
    border: 1px solid #2a2a3e;
    border-radius: 8px;
    padding: 10px 14px;
    font-size: 13px;
  }

  .msg.bot .source-card .src-title {
    font-weight: 600;
    color: #a29bfe;
    margin-bottom: 4px;
  }

  .msg.bot .source-card .src-meta {
    color: #666;
    font-size: 11px;
    margin-bottom: 6px;
  }

  .msg.bot .source-card .src-text {
    color: #aaa;
    line-height: 1.4;
  }

  .msg.bot .source-card .src-score {
    color: #555;
    font-size: 11px;
    margin-top: 4px;
  }

  .msg.bot .source-card a {
    color: #6c5ce7;
    text-decoration: none;
  }

  .msg.bot .source-card a:hover {
    text-decoration: underline;
  }

  .msg.error .bubble {
    background: #2d1b1b;
    color: #e57373;
    border: 1px solid #4a2020;
  }

  .typing {
    display: none;
    max-width: 720px;
    width: 100%;
    margin: 0 auto;
  }

  .typing.active { display: block; }

  .typing .bubble {
    background: #1e1e30;
    border: 1px solid #2a2a3e;
    border-radius: 12px;
    border-bottom-left-radius: 4px;
    padding: 14px 18px;
    display: inline-flex;
    gap: 5px;
  }

  .typing .dot {
    width: 7px; height: 7px;
    background: #555;
    border-radius: 50%;
    animation: blink 1.2s infinite;
  }

  .typing .dot:nth-child(2) { animation-delay: 0.2s; }
  .typing .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.3; }
    40% { opacity: 1; }
  }

  #input-area {
    background: #1a1a2e;
    border-top: 1px solid #2a2a3e;
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    align-items: flex-end;
    max-width: 768px;
    width: 100%;
    margin: 0 auto;
  }

  #input-area textarea {
    flex: 1;
    background: #12122a;
    border: 1px solid #2a2a3e;
    border-radius: 10px;
    padding: 12px 14px;
    color: #e0e0e0;
    font-family: inherit;
    font-size: 14px;
    resize: none;
    outline: none;
    min-height: 44px;
    max-height: 120px;
    line-height: 1.4;
    transition: border-color 0.2s;
  }

  #input-area textarea:focus {
    border-color: #6c5ce7;
  }

  #input-area textarea::placeholder {
    color: #555;
  }

  #send-btn {
    background: #6c5ce7;
    border: none;
    border-radius: 10px;
    color: #fff;
    padding: 12px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    white-space: nowrap;
  }

  #send-btn:hover { background: #5a4bd4; }
  #send-btn:disabled { background: #3a3a50; cursor: default; }

  #welcome {
    max-width: 720px;
    width: 100%;
    margin: auto;
    text-align: center;
    color: #555;
    padding: 20px;
  }

  #welcome h2 {
    font-size: 22px;
    color: #888;
    margin-bottom: 8px;
  }

  #welcome p {
    font-size: 14px;
    line-height: 1.6;
  }

  #top-k-control {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #666;
  }

  #top-k-control select {
    background: #12122a;
    border: 1px solid #2a2a3e;
    color: #aaa;
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 12px;
    outline: none;
  }
</style>
</head>
<body>

<header>
  <div class="logo">R</div>
  <h1>RAG Chat</h1>
  <div id="top-k-control">
    <label for="top-k">Contextes :</label>
    <select id="top-k">
      <option value="3">3</option>
      <option value="5" selected>5</option>
      <option value="8">8</option>
      <option value="10">10</option>
    </select>
  </div>
  <span>Recherche TF-IDF &mdash; sans IA</span>
</header>

<div id="chat">
  <div id="welcome">
    <h2>Recherche dans mes publications</h2>
    <p>Pose une question. Le moteur recherche les passages les plus pertinents<br>parmi tes posts via TF-IDF et affiche les sources.</p>
  </div>
</div>

<div class="typing" id="typing">
  <div class="bubble">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
</div>

<div id="input-area">
  <textarea id="q" rows="1" placeholder="Pose ta question..." autofocus></textarea>
  <button id="send-btn">Envoyer</button>
</div>

<script>
const chat = document.getElementById("chat");
const q = document.getElementById("q");
const sendBtn = document.getElementById("send-btn");
const typing = document.getElementById("typing");
const topK = document.getElementById("top-k");
const welcome = document.getElementById("welcome");

function escapeHtml(t) {
  const d = document.createElement("div");
  d.textContent = t;
  return d.innerHTML;
}

function addMsg(role, html, extra) {
  if (welcome) welcome.remove();
  const div = document.createElement("div");
  div.className = "msg " + role;
  const label = document.createElement("div");
  label.className = "label";
  label.textContent = role === "user" ? "Toi" : "RAG";
  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.innerHTML = html;
  div.appendChild(label);
  div.appendChild(bubble);
  if (extra) div.appendChild(extra);
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

function buildSources(sources) {
  if (!sources || !sources.length) return null;
  const wrap = document.createElement("div");
  wrap.className = "sources";
  sources.forEach((s, i) => {
    const card = document.createElement("div");
    card.className = "source-card";
    let inner = `<div class="src-title">${i + 1}. ${escapeHtml(s.title)}</div>`;
    inner += `<div class="src-meta">${escapeHtml(s.date)} &mdash; score: ${s.score}</div>`;
    inner += `<div class="src-text">${escapeHtml(s.text).substring(0, 300)}${s.text.length > 300 ? "..." : ""}</div>`;
    if (s.url) inner += `<div class="src-score"><a href="${escapeHtml(s.url)}" target="_blank">Lien</a></div>`;
    card.innerHTML = inner;
    wrap.appendChild(card);
  });
  return wrap;
}

async function send() {
  const text = q.value.trim();
  if (!text) return;

  addMsg("user", escapeHtml(text));
  q.value = "";
  q.style.height = "auto";
  sendBtn.disabled = true;
  typing.classList.add("active");

  try {
    const res = await fetch("/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: text, top_k: parseInt(topK.value) }),
    });
    const data = await res.json();
    typing.classList.remove("active");

    if (data.error) {
      addMsg("error", escapeHtml(data.error));
    } else {
      const answerText = data.answer || "Aucun résultat.";
      const src = buildSources(data.sources);
      addMsg("bot", escapeHtml(answerText), src);
    }
  } catch (e) {
    typing.classList.remove("active");
    addMsg("error", "Erreur de connexion : " + escapeHtml(e.message));
  }

  sendBtn.disabled = false;
  q.focus();
}

sendBtn.addEventListener("click", send);

q.addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

q.addEventListener("input", () => {
  q.style.height = "auto";
  q.style.height = Math.min(q.scrollHeight, 120) + "px";
});
</script>
</body>
</html>
